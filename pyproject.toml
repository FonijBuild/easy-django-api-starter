[project]
name = "easy-django-api-starter"
version = "0.1.0"
description = "A production-capable Django API foundation for maintainable business logic, admin workflows, and multi-client products."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dj-rest-auth>=7.2.0",
    "django>=6.1.1",
    "django-admin-honeypot @ git+https://github.com/dmpayton/django-admin-honeypot.git@develop",
    "django-allauth>=65.19.5",
    "django-cors-headers>=4.9.0",
    "django-debug-toolbar>=8.0.0",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.1",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "requests>=2.34.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
src = [".", "apps"]
exclude = [
    "**/migrations/*.py",
    "node_modules",
    "static",
    "staticfiles",
    "templates",
    ".venv",
]

[tool.ruff.lint]
extend-select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern Python syntax)
    "B",   # flake8-bugbear
    "DJ",  # flake8-django rules
]

[tool.ruff.lint.isort]
known-first-party = ["your_project_name"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
